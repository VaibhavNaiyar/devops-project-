- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, jq, unzip, fail2ban, unattended-upgrades]
    update_cache: true
    cache_valid_time: 3600

- name: Set hostname from the EC2 Name tag
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  changed_when: ansible_date_time.tz != 'IST'

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
    mode: "0644"
  notify: Reload ssh

- name: fail2ban protects SSH from brute force
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
